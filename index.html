<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarkari Exam Photo & Signature Resizer</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .card { background: white; max-width: 480px; width: 100%; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; font-size: 20px; color: #1a365d; text-align: center; }
    .badge { background: #e2e8f0; color: #334155; font-size: 11px; padding: 4px 8px; border-radius: 4px; display: block; text-align: center; margin-bottom: 15px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #333; }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .btn-group { display: flex; gap: 8px; margin: 15px 0; }
    button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-secondary { background: #059669; color: white; }
    .btn-download { background: #dc2626; color: white; width: 100%; margin-top: 10px; }
    #preview-area { text-align: center; margin-top: 15px; display: none; }
    canvas { max-width: 100%; border: 1px solid #94a3b8; border-radius: 4px; }
    .file-size-info { font-size: 13px; font-weight: bold; color: #059669; margin-top: 6px; }

    /* Buy Me a Coffee / Chai Button */
    .support-box {
      margin-top: 20px;
      padding: 14px;
      background: #fffbeb;
      border: 1px dashed #f59e0b;
      border-radius: 8px;
      text-align: center;
    }
    .support-box p {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: #92400e;
      font-weight: 600;
    }
    .btn-coffee {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #f59e0b;
      color: #ffffff;
      padding: 10px 18px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Sarkari Photo & Sign Resizer</h2>
    <span class="badge">SSC, Railway, Police & State Exam Ready</span>

    <div class="form-group">
      <label>1. Select Photo / Signature:</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="row">
      <div class="form-group">
        <label>Candidate Name (Optional):</label>
        <input type="text" id="nameInput" placeholder="e.g. RAHUL SINGH">
      </div>
      <div class="form-group">
        <label>Date of Photo (Optional):</label>
        <input type="text" id="dateInput" placeholder="DD-MM-YYYY">
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="processImage(50)">Photo Mode (&lt; 50 KB)</button>
      <button class="btn-secondary" onclick="processImage(20, true)">Sign Mode (&lt; 20 KB)</button>
    </div>

    <div id="preview-area">
      <canvas id="outputCanvas"></canvas>
      <div class="file-size-info" id="sizeLabel">Calculated Size: -- KB</div>
      <button class="btn-download" id="downloadBtn">Download Resized Image</button>
    </div>

    <!-- Buy Me A Chai / Coffee Section -->
    <div class="support-box">
      <p>Cyber Cafe ke ₹50 bache? Ek cup chai pila do! ☕</p>
      <!-- Apni UPhimanshu0532000@pingpay I ID 'YOUR_UPI_ID_HERE@upi' ki jagah daal do -->
      <a class="btn-coffee" href="upi://pay?pa=YOUR_UPI_ID_HERE@upi&pn=SupportDeveloper&am=10&cu=INR&tn=Thanks%20for%20resizer">
        ☕ Buy Me a Chai (₹10)
      </a>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const nameInput = document.getElementById('nameInput');
    const dateInput = document.getElementById('dateInput');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const previewArea = document.getElementById('preview-area');
    const sizeLabel = document.getElementById('sizeLabel');
    const downloadBtn = document.getElementById('downloadBtn');

    let loadedImg = null;

    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        loadedImg = new Image();
        loadedImg.onload = function() {
          previewArea.style.display = 'block';
          processImage(50);
        };
        loadedImg.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    function processImage(targetKB, isSign = false) {
      if (!loadedImg) {
        alert("Pehle image select karein!");
        return;
      }

      const name = nameInput.value.trim().toUpperCase();
      const date = dateInput.value.trim();

      const width = isSign ? 300 : 350;
      const height = isSign ? 120 : (name || date ? 450 : 420);
      const textBarHeight = (name || date) && !isSign ? 70 : 0;

      canvas.width = width;
      canvas.height = height;

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(loadedImg, 0, 0, width, height - textBarHeight);

      if (textBarHeight > 0) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, height - textBarHeight, width, textBarHeight);
        ctx.fillStyle = "#000000";
        ctx.textAlign = "center";

        if (name && date) {
          ctx.font = "bold 15px sans-serif";
          ctx.fillText(name, width / 2, height - textBarHeight + 25);
          ctx.font = "14px sans-serif";
          ctx.fillText("DOOP: " + date, width / 2, height - textBarHeight + 52);
        } else if (name || date) {
          ctx.font = "bold 16px sans-serif";
          ctx.fillText(name || ("DOOP: " + date), width / 2, height - textBarHeight + 40);
        }
      }

      compressToTargetKB(targetKB);
    }

    function compressToTargetKB(targetKB) {
      let quality = 0.92;
      let dataUrl = canvas.toDataURL('image/jpeg', quality);
      let kb = Math.round((dataUrl.length * 3 / 4) / 1024);

      while (kb > targetKB && quality > 0.1) {
        quality -= 0.05;
        dataUrl = canvas.toDataURL('image/jpeg', quality);
        kb = Math.round((dataUrl.length * 3 / 4) / 1024);
      }

      sizeLabel.innerText = `Final Size: ~${kb} KB (Target: Under ${targetKB} KB)`;
      
      downloadBtn.onclick = function() {
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = `sarkari_resized_${targetKB}kb.jpg`;
        a.click();
      };
    }
  </script>
</body>
</html>
